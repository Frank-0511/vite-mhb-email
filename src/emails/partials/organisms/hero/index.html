<script props>
  module.exports = {
    variant: props.variant || "v1",
    title: props.title || "Bienvenido a Mi Empresa",
    subtitle: props.subtitle || "Descubre todo lo que podemos hacer por ti",
    buttonText: props["button-text"] || "Explorar ahora",
    // El motor de componentes entrega show-button="false" ya como booleano.
    showButton: props["show-button"] !== false,
  };
</script>

<if condition="variant === 'v1'">
  <x-hero-v1
    title="[[title]]"
    subtitle="[[subtitle]]"
    button-text="[[buttonText]]"
    show-button="[[showButton]]"
  />
</if>

<elseif condition="variant === 'v2'">
  <x-hero-v2
    title="[[title]]"
    subtitle="[[subtitle]]"
    button-text="[[buttonText]]"
    show-button="[[showButton]]"
  />
</elseif>

<else>
  <x-hero-v1
    title="[[title]]"
    subtitle="[[subtitle]]"
    button-text="[[buttonText]]"
    show-button="[[showButton]]"
  />
</else>
