<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Preview & Edit - EmailForge Toolkit</title>
    <!-- Use the same Tailwind output -->
    <link href="/shared/styles/tailwind.css" rel="stylesheet" />

    <!-- Vanilla JSONEditor (Svelte JSONEditor) -->
    <link
      href="https://cdn.jsdelivr.net/npm/vanilla-jsoneditor@3.11.0/themes/jse-theme-dark.css"
      rel="stylesheet"
    />
    <script>
      // Prevent FOUC by applying app theme immediately
      if (localStorage.getItem("app-theme") === "dark" || !("app-theme" in localStorage)) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body
    class="preview-shell font-sans text-slate-800 bg-slate-50 dark:bg-slate-900 dark:text-slate-200 flex h-screen overflow-hidden"
  >
    <!-- Tab Navigation (≤1259px) -->
    <nav id="mobile-tab-bar" class="mobile-tab-bar" role="tablist" aria-label="Vistas del editor">
      <button
        id="tab-btn-preview"
        type="button"
        class="tab-btn active"
        role="tab"
        aria-selected="true"
        aria-controls="right-panel"
      >
        <i data-lucide="eye" class="w-4 h-4 shrink-0"></i>
        <span>Vista previa</span>
      </button>
      <button
        id="tab-btn-editor"
        type="button"
        class="tab-btn"
        role="tab"
        aria-selected="false"
        aria-controls="left-panel"
      >
        <i data-lucide="code" class="w-4 h-4 shrink-0"></i>
        <span>Editar</span>
      </button>
    </nav>

    <!-- Panel Izquierdo: Editor -->
    <div
      id="left-panel"
      class="w-[550px] flex flex-col bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 shrink-0"
    >
      <!-- Header del Editor -->
      <div
        class="editor-header px-4 py-3 sm:px-6 sm:py-5 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex justify-between items-center"
      >
        <!-- Skeleton del Header Izquierdo (botón volver, separador, icono y título) -->
        <div
          id="header-left-skeleton"
          class="flex items-center gap-2 sm:gap-3 animate-pulse min-w-0"
          aria-hidden="true"
        >
          <div
            id="back-btn-skeleton"
            class="w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 shrink-0"
          ></div>
          <div class="h-5 border-l border-slate-200 dark:border-slate-700 shrink-0"></div>
          <div class="flex items-center gap-2 min-w-0">
            <div class="w-5 h-5 rounded bg-slate-200 dark:bg-slate-700 shrink-0"></div>
            <div
              id="template-name-skeleton"
              class="h-5 w-20 sm:w-24 bg-slate-200 dark:bg-slate-700 rounded"
            ></div>
          </div>
        </div>

        <!-- Contenido Real del Header Izquierdo -->
        <div id="header-left-content" class="hidden items-center gap-2 sm:gap-3 min-w-0">
          <a
            id="btn-back"
            href="/"
            class="text-sky-600 dark:text-sky-400 hover:text-sky-700 dark:hover:text-sky-300 font-semibold inline-flex items-center p-1 sm:p-0 transition-colors shrink-0"
            title="Volver a templates"
          >
            <i data-lucide="arrow-left" class="w-5 h-5 shrink-0"></i>
          </a>
          <div class="h-5 border-l border-slate-300 dark:border-slate-600 shrink-0"></div>
          <h1
            class="text-base sm:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2 m-0 min-w-0"
          >
            <i data-lucide="file-text" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0"></i>
            <span
              id="template-name"
              class="truncate max-w-[120px] sm:max-w-[180px] md:max-w-none"
            ></span>
          </h1>
        </div>

        <!-- Acciones del Header Izquierdo -->
        <div class="flex items-center gap-2 shrink-0">
          <!-- Skeleton del App Theme Toggle -->
          <div
            id="theme-toggle-skeleton"
            class="w-9 h-9 rounded-md bg-slate-200 dark:bg-slate-700 animate-pulse shrink-0"
            aria-hidden="true"
          ></div>

          <!-- App Theme Toggle envuelto en menú desplegable ⋯ en <480px, directo en ≥480px -->
          <details id="editor-more-menu" class="menu-more-dropdown" open>
            <summary
              class="w-9 h-9 flex items-center justify-center rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 list-none cursor-pointer"
              title="Más opciones"
              aria-label="Más opciones"
            >
              <i data-lucide="more-horizontal" class="w-5 h-5 shrink-0"></i>
            </summary>
            <div class="menu-dropdown-body">
              <span class="dropdown-item-label">Tema</span>
              <theme-toggle id="app-theme-toggle" class="hidden">
                <button
                  type="button"
                  aria-label="Toggle theme"
                  class="w-9 h-9 flex items-center justify-center rounded-md border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700"
                >
                  <i data-lucide="sun" class="w-5 h-5 text-slate-600 dark:hidden"></i>
                  <i data-lucide="moon" class="w-5 h-5 text-amber-400 hidden dark:block"></i>
                </button>
              </theme-toggle>
            </div>
          </details>
        </div>
      </div>

      <!-- Contenedor del Editor -->
      <div id="editor-container" class="flex-1 overflow-hidden relative bg-white dark:bg-slate-900">
        <!-- Skeleton mientras carga el editor y los datos -->
        <div
          id="editor-skeleton"
          class="p-6 space-y-4 animate-pulse bg-white dark:bg-slate-900"
          aria-hidden="true"
        >
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div>
          <div class="space-y-2 pl-4">
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div>
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-2/5"></div>
          </div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/4 pt-2"></div>
          <div class="space-y-2 pl-4">
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-4/5"></div>
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-3/5"></div>
          </div>
        </div>
      </div>

      <!-- Acciones Inferiores -->
      <div
        class="px-6 py-5 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col gap-3"
      >
        <!-- Skeleton mientras carga -->
        <div id="actions-skeleton" class="flex flex-col gap-3 animate-pulse" aria-hidden="true">
          <div class="h-12 bg-slate-200 dark:bg-slate-700 rounded-lg w-full"></div>
          <div class="h-9 bg-slate-200 dark:bg-slate-700 rounded-lg w-full"></div>
        </div>

        <div id="actions-buttons" class="hidden flex-col gap-3">
          <button
            id="btn-save"
            disabled
            class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-lg shadow-sm dark:shadow-lg flex justify-center items-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <i data-lucide="save" class="w-5 h-5 shrink-0"></i>
            <span>Guardar</span>
          </button>
          <button
            id="btn-reset"
            disabled
            class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-semibold py-2 px-4 rounded-lg transition-colors text-sm border border-slate-200 dark:border-transparent disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Descartar
          </button>
        </div>
      </div>
    </div>

    <!-- Panel Derecho: Preview -->
    <div
      id="right-panel"
      class="flex flex-col bg-slate-100 dark:bg-slate-800 flex-1 overflow-hidden"
    >
      <!-- Top bar del preview con soporte responsivo -->
      <div
        id="preview-top-container"
        class="preview-top-container bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-slate-900/50 z-10"
      >
        <!-- Fila 1: Encabezado del preview (título, estado de sincronización y validación) -->
        <div class="preview-header-bar">
          <div class="preview-title-wrap">
            <a
              href="/"
              class="preview-back-btn text-sky-600 dark:text-sky-400 hover:text-sky-700 dark:hover:text-sky-300 font-semibold items-center p-1 transition-colors shrink-0"
              title="Volver a templates"
            >
              <i data-lucide="arrow-left" class="w-5 h-5 shrink-0"></i>
            </a>
            <!-- Skeleton de Vista previa en vivo (icono y texto) -->
            <div
              id="preview-title-skeleton"
              class="flex items-center gap-2 animate-pulse shrink-0"
              aria-hidden="true"
            >
              <div class="w-4 h-4 rounded bg-slate-200 dark:bg-slate-700 shrink-0"></div>
              <div class="h-4 w-32 bg-slate-200 dark:bg-slate-700 rounded"></div>
            </div>
            <span
              id="preview-title"
              class="hidden font-medium text-slate-700 dark:text-slate-200 items-center gap-2 shrink-0 text-base"
            >
              <i data-lucide="eye" class="w-4 h-4 shrink-0"></i>
              <span>Vista previa en vivo</span>
            </span>
          </div>

          <div class="preview-status-wrap">
            <!-- Skeleton de estado de sincronización -->
            <div
              id="sync-status-skeleton"
              class="h-5 w-20 sm:w-24 bg-slate-200 dark:bg-slate-700 rounded animate-pulse"
              aria-hidden="true"
            ></div>
            <span
              id="sync-status"
              class="hidden text-green-600 font-medium text-xs sm:text-sm items-center gap-1 shrink-0"
            >
              <span class="w-2 h-2 rounded-full bg-green-500"></span> Sincronizado
            </span>
            <div
              id="preview-render-error"
              class="preview-render-error"
              role="status"
              aria-live="polite"
              hidden
            ></div>
            <span
              id="esp-validation-status"
              class="esp-validation-status"
              role="status"
              aria-live="polite"
              aria-hidden="true"
              tabindex="0"
            ></span>
          </div>
        </div>

        <!-- Fila 2: Barra contextual (Viewport, Tema de Template y Copiar HTML) -->
        <div id="preview-contextual-bar" class="preview-contextual-bar">
          <!-- Skeleton de controles del topbar -->
          <div
            id="topbar-skeleton"
            class="flex items-center gap-2 sm:gap-3 animate-pulse"
            aria-hidden="true"
          >
            <div class="h-7 w-28 sm:w-36 bg-slate-200 dark:bg-slate-700 rounded"></div>
            <div class="h-7 w-16 sm:w-20 bg-slate-200 dark:bg-slate-700 rounded"></div>
            <div class="h-7 w-36 sm:w-48 bg-slate-200 dark:bg-slate-700 rounded"></div>
          </div>

          <!-- Controles del top bar -->
          <div id="topbar-controls" class="hidden items-center gap-2 sm:gap-4">
            <!-- Grupo de controles de render y tema (Fila 2 en 1260-1560px) -->
            <div
              id="preview-render-controls"
              class="preview-render-controls flex items-center gap-2 sm:gap-3"
            >
              <!-- View Mode Selector (Render vs Código) -->
              <div
                id="view-mode-selector"
                class="inline-flex overflow-hidden rounded border border-slate-200 dark:border-slate-700"
                role="group"
                aria-label="Modo de vista"
              >
                <button
                  id="view-mode-render"
                  type="button"
                  class="px-2 sm:px-2.5 py-1 sm:py-1.5 text-xs font-semibold bg-sky-500 text-white hover:bg-sky-600 transition-colors shrink-0 flex items-center justify-center"
                  title="Vista renderizada"
                  aria-pressed="true"
                  aria-label="Vista previa renderizada"
                >
                  <i data-lucide="eye" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="view-mode-label ml-1">
                    <span class="view-mode-label-full">Vista previa</span>
                    <span class="view-mode-label-short">Render</span>
                  </span>
                </button>
                <button
                  id="view-mode-source"
                  type="button"
                  class="px-2 sm:px-2.5 py-1 sm:py-1.5 text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border-l border-slate-200 dark:border-slate-700 shrink-0 flex items-center justify-center"
                  title="Código fuente HTML"
                  aria-pressed="false"
                  aria-label="Código fuente HTML"
                >
                  <i data-lucide="code" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="view-mode-label ml-1">
                    <span class="view-mode-label-full">Código HTML</span>
                    <span class="view-mode-label-short">Código</span>
                  </span>
                </button>
              </div>

              <!-- Template Theme Toggle (Icon button) -->
              <button
                id="theme-toggle-template"
                class="p-1 sm:p-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-semibold flex items-center justify-center transition-colors border border-slate-200 dark:border-slate-700 shrink-0"
                title="Alternar tema del template (claro / oscuro)"
                aria-label="Alternar tema del template"
              >
                <i
                  id="template-icon-light"
                  data-lucide="sun"
                  class="hidden w-3.5 h-3.5 shrink-0"
                ></i>
                <i
                  id="template-icon-dark"
                  data-lucide="moon"
                  class="hidden w-3.5 h-3.5 shrink-0"
                ></i>
                <span class="sr-only">Tema del template</span>
              </button>
            </div>

            <!-- Divisor entre controles de render y viewport -->
            <div
              id="preview-viewport-divider"
              class="h-4 border-l border-slate-200 dark:border-slate-700 shrink-0"
              aria-hidden="true"
            ></div>

            <!-- Grupo de controles de viewport -->
            <div
              id="preview-viewport-controls"
              class="preview-viewport-controls flex items-center gap-2"
              aria-label="Viewport"
            >
              <div
                class="inline-flex overflow-hidden rounded border border-slate-200 dark:border-slate-700"
                role="group"
                aria-label="Viewport selector"
              >
                <button
                  id="viewport-desktop"
                  type="button"
                  class="px-2 sm:px-2.5 py-1 sm:py-1.5 text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0 flex items-center gap-1"
                  title="Desktop (600px)"
                  aria-label="Desktop (600px)"
                >
                  <i data-lucide="monitor" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="viewport-label-full">600px</span>
                  <span class="viewport-label-short">600</span>
                </button>
                <button
                  id="viewport-mobile"
                  type="button"
                  class="px-2 sm:px-2.5 py-1 sm:py-1.5 text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border-l border-slate-200 dark:border-slate-700 shrink-0 flex items-center gap-1"
                  title="Mobile (375px)"
                  aria-label="Mobile (375px)"
                >
                  <i data-lucide="smartphone" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="viewport-label-full">375px</span>
                  <span class="viewport-label-short">375</span>
                </button>
                <button
                  id="viewport-custom"
                  type="button"
                  class="px-2 sm:px-2.5 py-1 sm:py-1.5 text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border-l border-slate-200 dark:border-slate-700 shrink-0 flex items-center gap-1"
                  title="Ancho personalizado"
                  aria-label="Ancho personalizado"
                >
                  <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="viewport-custom-label">Custom</span>
                </button>
              </div>

              <div id="viewport-custom-input-wrap" class="hidden items-center gap-1 sm:gap-2">
                <input
                  id="viewport-custom-input"
                  type="number"
                  inputmode="numeric"
                  min="280"
                  max="1200"
                  step="1"
                  class="w-16 sm:w-24 px-1.5 sm:px-2 py-1 text-xs rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-4 focus:ring-sky-500/10 dark:focus:ring-sky-400/10"
                  aria-label="Custom viewport width"
                />
                <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">px</span>
              </div>
            </div>
          </div>

          <!-- Copiar HTML -->
          <div class="preview-copy-wrap">
            <!-- Skeleton de Copiar HTML -->
            <div
              id="copy-html-skeleton"
              class="h-7 w-20 sm:w-24 bg-slate-200 dark:bg-slate-700 rounded animate-pulse"
              aria-hidden="true"
            ></div>
            <button
              id="btn-copy-html"
              type="button"
              class="hidden p-1 px-2 sm:px-2.5 py-1 sm:py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-semibold items-center gap-1 transition-colors border border-slate-200 dark:border-slate-700 shrink-0"
              title="Exportar HTML final (copiar o descargar)"
              aria-label="Exportar HTML final"
            >
              <i data-lucide="file-output" class="w-3.5 h-3.5 shrink-0"></i>
              <span class="export-label">
                <span class="export-label-full">Exportar HTML</span>
                <span class="export-label-short">Exportar</span>
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- Preview area -->
      <div class="flex-1 overflow-auto preview-content-area">
        <div class="min-h-full flex justify-center p-3 sm:p-4 md:p-6">
          <div
            id="preview-frame"
            class="bg-white dark:bg-slate-900 overflow-hidden shadow-sm"
            style="width: 600px"
          >
            <!-- Skeleton mientras se compila y carga el primer render -->
            <div id="preview-skeleton" class="p-8 space-y-6 animate-pulse" aria-hidden="true">
              <div
                class="flex justify-between items-center pb-4 border-b border-slate-100 dark:border-slate-800"
              >
                <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-28"></div>
                <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-16"></div>
              </div>
              <div class="h-36 bg-slate-200 dark:bg-slate-700 rounded-lg w-full"></div>
              <div class="space-y-3">
                <div class="h-5 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-4/6"></div>
              </div>
              <div class="pt-2">
                <div class="h-10 bg-slate-200 dark:bg-slate-700 rounded-md w-36 mx-auto"></div>
              </div>
              <div
                class="pt-6 border-t border-slate-100 dark:border-slate-800 flex justify-center space-x-4"
              >
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-16"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-16"></div>
              </div>
            </div>

            <!-- Iframe donde volcaremos el HTML vivo -->
            <iframe id="preview-iframe" title="Template Preview" class="hidden"></iframe>

            <!-- Visor de código fuente HTML escapado (MHB-17) -->
            <div
              id="preview-source-container"
              class="preview-source-container hidden"
              tabindex="0"
              role="region"
              aria-label="Código fuente HTML del template"
            >
              <pre
                id="preview-source-pre"
                class="preview-source-pre"
              ><code id="preview-source-code" class="preview-source-code"></code></pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Export / Copy HTML Dialog -->
    <dialog id="dialog-copy-html" aria-labelledby="copy-html-dialog-title">
      <div class="copy-html-dialog-inner">
        <!-- Botón de cerrar X en la esquina superior derecha -->
        <button
          id="btn-copy-cancel"
          type="button"
          class="copy-html-close-btn"
          aria-label="Cerrar modal"
          title="Cerrar"
        >
          <i data-lucide="x" style="width: 16px; height: 16px"></i>
        </button>

        <!-- Cabecera moderna con icono y chip de template -->
        <div class="copy-html-header">
          <div class="copy-html-icon-badge">
            <i data-lucide="file-output" style="width: 20px; height: 20px"></i>
          </div>
          <div class="copy-html-header-text">
            <div class="copy-html-title-row">
              <h3 id="copy-html-dialog-title" class="copy-html-title">Exportar HTML</h3>
              <span id="copy-html-template-chip" class="copy-html-template-chip"
                >template.html</span
              >
            </div>
            <p class="copy-html-desc">
              Genera el HTML listo para tu ESP o descarga el archivo final.
            </p>
          </div>
        </div>

        <!-- Segmented Control estilo píldora para destino -->
        <div class="export-segmented-control" role="radiogroup" aria-label="Destino de exportación">
          <label class="export-segmented-tab" for="export-mode-copy">
            <input type="radio" id="export-mode-copy" name="export-mode" value="copy" checked />
            <span class="export-segmented-label">
              <i data-lucide="copy" style="width: 14px; height: 14px"></i>
              <span>Copiar al portapapeles</span>
            </span>
          </label>

          <label class="export-segmented-tab" for="export-mode-download">
            <input type="radio" id="export-mode-download" name="export-mode" value="download" />
            <span class="export-segmented-label">
              <i data-lucide="download" style="width: 14px; height: 14px"></i>
              <span>Descargar archivo</span>
            </span>
          </label>
        </div>

        <!-- Lista de Tarjetas de Acción (Action Cards) -->
        <div class="export-actions-list">
          <!-- Tarjeta 1: Compilar y Ejecutar (Recomendado) -->
          <button
            id="btn-export-build"
            type="button"
            class="export-action-card export-action-card-primary"
          >
            <div class="export-card-icon-wrap primary">
              <i data-lucide="zap" style="width: 18px; height: 18px"></i>
            </div>
            <div class="export-card-content">
              <div class="export-card-header">
                <span id="text-export-build" class="export-card-title">Compilar y copiar</span>
                <span class="export-badge export-badge-recommended">Recomendado</span>
              </div>
              <p id="desc-export-build" class="export-card-desc">
                Compila con Maizzle e inyecta los estilos y variables actuales del preview.
              </p>
            </div>
            <div class="export-card-arrow" aria-hidden="true">
              <i data-lucide="arrow-right" style="width: 16px; height: 16px"></i>
            </div>
          </button>

          <!-- Tarjeta 2: Usar versión existente en disco (Rápido) -->
          <button
            id="btn-export-existing"
            type="button"
            class="export-action-card export-action-card-secondary"
          >
            <div class="export-card-icon-wrap secondary">
              <i
                id="icon-export-existing-copy"
                data-lucide="copy"
                style="width: 16px; height: 16px"
              ></i>
              <i
                id="icon-export-existing-download"
                data-lucide="download"
                style="width: 16px; height: 16px; display: none"
              ></i>
            </div>
            <div class="export-card-content">
              <div class="export-card-header">
                <span id="text-export-existing" class="export-card-title"
                  >Copiar versión en disco</span
                >
                <span class="export-badge export-badge-fast">Rápido</span>
              </div>
              <p id="desc-export-existing" class="export-card-desc">
                Usa el último HTML generado en dist/ sin volver a compilar.
              </p>
            </div>
            <div class="export-card-arrow" aria-hidden="true">
              <i data-lucide="arrow-right" style="width: 16px; height: 16px"></i>
            </div>
          </button>
        </div>

        <!-- Feedback de estado: loading / success / error -->
        <div
          id="copy-html-status"
          class="copy-html-status hidden"
          role="status"
          aria-live="polite"
        ></div>
      </div>
    </dialog>

    <!-- Mobile Tab Switching & Accessibility Controller -->
    <script>
      (function () {
        function initMobileTabs() {
          const btnPreview = document.getElementById("tab-btn-preview");
          const btnEditor = document.getElementById("tab-btn-editor");
          if (!btnPreview || !btnEditor) return;

          function switchTab(activeTab) {
            const isPreview = activeTab === "preview";

            btnPreview.classList.toggle("active", isPreview);
            btnPreview.setAttribute("aria-selected", isPreview ? "true" : "false");

            btnEditor.classList.toggle("active", !isPreview);
            btnEditor.setAttribute("aria-selected", !isPreview ? "true" : "false");

            document.body.setAttribute("data-mobile-tab", activeTab);
          }

          btnPreview.addEventListener("click", () => switchTab("preview"));
          btnEditor.addEventListener("click", () => switchTab("editor"));

          // Iniciar por defecto en la pestaña Vista previa en móvil
          if (!document.body.hasAttribute("data-mobile-tab")) {
            document.body.setAttribute("data-mobile-tab", "preview");
          }
        }

        // Cerrar menú desplegable ⋯ al hacer click fuera (solo aplica en
        // <480px: en ese ancho el menú es un desplegable real. En ≥480px
        // permanece "open" siempre a propósito — ahí no es un desplegable,
        // es cómo se muestra el toggle de tema directamente en el header).
        document.addEventListener("click", (e) => {
          const menu = document.getElementById("editor-more-menu");
          if (
            menu &&
            menu.hasAttribute("open") &&
            window.matchMedia("(max-width: 479px)").matches &&
            e.target &&
            !menu.contains(/** @type {Node} */ (e.target))
          ) {
            menu.removeAttribute("open");
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initMobileTabs);
        } else {
          initMobileTabs();
        }
      })();
    </script>

    <!-- Preview App Entry Point -->
    <script type="module" src="/features/preview/main.js"></script>
  </body>
