<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmailForge Toolkit</title>
    <link href="/shared/styles/tailwind.css" rel="stylesheet" />
    <style>
      .preview-wrapper {
        position: relative;
        width: 100%;
        height: 220px;
        overflow: hidden;
        pointer-events: none;
      }

      .preview-wrapper iframe {
        position: absolute;
        top: 0;
        left: 50%;
        width: 600px;
        height: 900px;
        border: none;
        transform: translateX(-50%) scale(0.48);
        transform-origin: top center;
        pointer-events: none;
      }

      /* Template cards enhancement */
      #template-list a {
        --tw-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      }

      #template-list a:hover {
        --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }

      .dark #template-list a:hover {
        --tw-shadow: 0 10px 15px -3px rgb(15 23 42 / 0.3);
      }
    </style>
    <script>
      if (localStorage.getItem("app-theme") === "dark" || !("app-theme" in localStorage)) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-white font-sans">
    <!-- Header -->
    <header
      class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-8 py-5 flex items-center justify-between shadow-sm dark:shadow-slate-900/50"
    >
      <span class="text-2xl font-bold text-sky-600 dark:text-sky-400 flex items-center gap-2">
        <i data-lucide="rocket" class="w-7 h-7"></i>
        <span>EmailForge Toolkit</span>
      </span>
      <div class="flex items-center gap-4">
        <a
          href="/library"
          class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-sky-400 transition-colors flex items-center gap-1"
          title="Ver Component Library"
        >
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span>Components</span>
        </a>
        <theme-toggle>
          <button
            type="button"
            aria-label="Toggle theme"
            class="w-9 h-9 flex items-center justify-center rounded-md border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700"
          >
            <i data-lucide="sun" class="w-5 h-5 text-slate-600 dark:hidden"></i>
            <i data-lucide="moon" class="w-5 h-5 text-amber-400 hidden dark:block"></i>
          </button>
        </theme-toggle>
      </div>
    </header>

    <!-- Main -->
    <main class="p-6 sm:p-8 max-w-7xl mx-auto">
      <div class="mb-6">
        <h1
          class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2"
        >
          <i data-lucide="layout-grid" class="w-6 h-6 text-sky-600 dark:text-sky-400"></i>
          <span>Catálogo de Templates</span>
        </h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">
          Templates de email de producto optimizados para compatibilidad, variables ESP y
          compilación Maizzle.
        </p>
      </div>

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
          gap: 1.5rem;
        "
        id="template-list"
      ></div>

      <!-- Footer Info -->
      <div
        class="mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400"
      >
        <p class="m-0">EmailForge Toolkit — Entorno de desarrollo local</p>
        <p class="m-0 text-slate-400 dark:text-slate-500">
          Crea nuevos templates por terminal con <code class="font-mono">bun run cli</code> o
          <code class="font-mono">bun run generate:email &lt;nombre&gt;</code>
        </p>
      </div>
    </main>

    <script type="module" src="/features/home/main.js"></script>
  </body>
</html>
