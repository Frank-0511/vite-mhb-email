<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmailForge Toolkit</title>
    <link href="/shared/styles/tailwind.css" rel="stylesheet" />
    <script>
      if (localStorage.getItem("app-theme") === "dark" || !("app-theme" in localStorage)) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body class="home-shell">
    <!-- Header -->
    <header class="home-header">
      <span class="home-brand">
        <i data-lucide="rocket" class="w-7 h-7"></i>
        <span>EmailForge Toolkit</span>
      </span>
      <nav class="home-actions" aria-label="Navegación principal">
        <a href="/library" class="home-nav-link" title="Ver Component Library">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span>Components</span>
        </a>
        <theme-toggle class="home-theme-toggle">
          <button type="button" aria-label="Toggle theme" class="theme-toggle-button">
            <i data-lucide="sun" class="w-5 h-5 text-slate-600 dark:hidden"></i>
            <i data-lucide="moon" class="w-5 h-5 text-amber-400 hidden dark:block"></i>
          </button>
        </theme-toggle>
      </nav>
    </header>

    <!-- Main -->
    <main class="home-content">
      <div class="template-grid" id="template-list"></div>

      <!-- Footer Info -->
      <footer class="home-footer">
        <p class="m-0">EmailForge Toolkit — Entorno de desarrollo local</p>
      </footer>
    </main>

    <script type="module" src="/features/home/main.ts"></script>
  </body>
</html>
