name: Audit

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Accessibility & Contrast Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Contraste · WCAG (informativo)
        # Informativo: no bloquea el pipeline
        continue-on-error: true
        run: bun run lint:contrast

      - name: Accesibilidad · axe-core (informativo)
        # Informativo: no bloquea el pipeline
        continue-on-error: true
        run: bun run a11y-check
