name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Los tests mockean puppeteer; Chrome solo lo necesita audit.yml.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          # El guard de iconos compara contra master/origin/master; requiere historial.
          fetch-depth: 0

      - &setup-node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - &cache-deps
        name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - &install
        name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format · Prettier
        run: bun run format:check

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *cache-deps
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *cache-deps
      - *install

      - name: Test
        run: bun run test

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *cache-deps
      - *install

      - name: Build
        run: bun run build

      - name: Verify dist matches build
        run: git diff --exit-code -- dist/

      - name: Fetch base branch for icon guard
        run: git fetch origin master

      - name: Validate email compatibility
        run: bun run validate-email

      - name: Check dist baseline
        run: bun run check:dist-baseline

      - name: Check HTML size
        run: bun run check-size

      - name: Check migration inventory
        run: bun run check:inventory

  # Compatibilidad: yarn, npm y pnpm instalan desde cero (cada quien decide su
  # lockfile); validan build, validate-email, check-size, typecheck y test.
  # (check:dist-baseline es gate estricto del carril congelado con bun).
  package-managers:
    name: Compat (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [yarn, npm, pnpm]
    env:
      # Yarn 4 activa --immutable en CI por defecto; aquí no hay yarn.lock.
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    steps:
      - *checkout
      - *setup-node

      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: "12.10.1"

      - name: Setup Yarn 4
        if: matrix.pm == 'yarn'
        run: corepack enable && corepack install -g yarn@4.18.1

      - name: Install dependencies
        run: |
          case "${{ matrix.pm }}" in
            yarn) yarn install ;;
            npm) npm install --no-audit --no-fund ;;
            pnpm) pnpm install --no-frozen-lockfile ;;
          esac

      - name: Typecheck
        run: ${{ matrix.pm }} run typecheck

      - name: Test
        run: ${{ matrix.pm }} run test

      - name: Build
        run: ${{ matrix.pm }} run build

      - name: Validate email
        run: ${{ matrix.pm }} run validate-email

      - name: Check HTML size
        run: ${{ matrix.pm }} run check-size

      - name: Verify bun.lock untouched
        run: git diff --exit-code -- bun.lock

  # Check agregado con el nombre que MHB-45 marcará como requerido.
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, package-managers]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "$RESULTS" != "success success success success success" ]; then
            echo "Jobs fallidos o cancelados: $RESULTS"
            exit 1
          fi
        env:
          RESULTS: ${{ needs.quality.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.package-managers.result }}
