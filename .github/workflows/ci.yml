name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed file types
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            md:
              - "**/*.md"
            html:
              - "src/emails/templates/**/*.html"
              - "src/emails/layouts/**/*.html"
              - "src/emails/partials/**/*.html"
              - "src/web/**/*.html"
            js:
              - "scripts/**/*.js"
              - "scripts/**/*.mjs"
              - "src/web/**/*.js"
              - "vite.config.js"
              - "maizzle.config.js"
              - "tailwind.config.js"
              - "tailwind.email.config.js"
              - "postcss.config.js"
              - "eslint.config.js"
            json:
              - "**/*.json"
            css:
              - "src/**/*.css"
            quality:
              - ".github/workflows/**"
              - "scripts/**"
              - "src/emails/**"
              - "src/web/**"
              - "vite.config.js"
              - "maizzle.config.js"
              - "tailwind.config.js"
              - "tailwind.email.config.js"
              - "postcss.config.js"
              - "eslint.config.js"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "tsconfig.json"
              - ".htmlhintrc"
              - ".stylelintrc.json"
              - ".prettierrc.json"
            format:
              - "**/*.md"
              - "**/*.html"
              - "**/*.{js,mjs,json,css,yml,yaml}"
              - "*.code-workspace"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format · Prettier
        if: steps.filter.outputs.format == 'true'
        run: bun run format:check

      - name: Lint · Markdown
        if: steps.filter.outputs.md == 'true'
        run: bun run lint:md

      - name: Lint · HTML
        if: steps.filter.outputs.html == 'true'
        run: bun run lint:html

      - name: Lint · JavaScript
        if: steps.filter.outputs.js == 'true'
        run: bun run lint:js

      - name: Lint · JSON
        if: steps.filter.outputs.json == 'true'
        run: bun run lint:json

      - name: Lint · CSS
        if: steps.filter.outputs.css == 'true'
        run: bun run lint:css

      - name: Contraste · WCAG (informativo)
        if: steps.filter.outputs.css == 'true'
        # Informativo: no bloquea el pipeline
        continue-on-error: true
        run: bun run lint:contrast

      - name: Accesibilidad · axe-core (informativo)
        if: steps.filter.outputs.quality == 'true'
        # Informativo: no bloquea el pipeline
        continue-on-error: true
        run: bun run a11y-check

      - name: Typecheck
        if: steps.filter.outputs.quality == 'true'
        run: bun run typecheck

      - name: Test
        if: steps.filter.outputs.quality == 'true'
        run: bun run test

      - name: Build
        if: steps.filter.outputs.quality == 'true'
        run: bun run build
