name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Los tests mockean puppeteer; Chrome solo lo necesita audit.yml.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - &cache-deps
        name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - &install
        name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format · Prettier
        run: bun run format:check

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - *cache-deps
      - *install

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - *cache-deps
      - *install

      - name: Test
        run: bun run test

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - *cache-deps
      - *install

      - name: Build
        run: bun run build

      - name: Verify dist matches build
        run: git diff --exit-code -- dist/

      - name: Validate email compatibility
        run: bun run validate-email

      - name: Check dist baseline
        run: bun run check:dist-baseline

      - name: Check HTML size
        run: bun run check-size

      - name: Check migration inventory
        run: bun run check:inventory

  # Check agregado con el nombre que MHB-45 marcará como requerido.
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "$RESULTS" != "success success success success" ]; then
            echo "Jobs fallidos o cancelados: $RESULTS"
            exit 1
          fi
        env:
          RESULTS: ${{ needs.quality.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }}
