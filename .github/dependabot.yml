version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        # Dependencias críticas del pipeline de email (revisión manual obligatoria).
        # Mantenido en sincronía conceptual con MANUAL_REVIEW_DEPS en .github/workflows/dependabot-automerge.yml
        exclude-patterns:
          - "@maizzle/*"
          - "maizzle"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "juice"
          - "handlebars"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
